name = "albert-linson-platform"
main = ".open-next/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Free-tier Cloudflare D1 Relational SQLite Database
[[d1_databases]]
binding = "DB"
database_name = "albert-linson-db"
database_id = "167e5c06-fe0e-4147-8187-0849fbcce576"

# Free-tier Cloudflare R2 Private Document Storage (Enable via Cloudflare Dashboard if needed)
# [[r2_buckets]]
# binding = "RESUME_STORAGE"
# bucket_name = "albert-linson-resumes"

[vars]
ENVIRONMENT = "production"
NEXT_PUBLIC_APP_NAME = "Albert Linson Personal Intelligence Platform"
OPENROUTER_MODEL = "openrouter/free"
OPENROUTER_FALLBACK_MODEL = "google/gemini-2.0-flash-exp:free"
