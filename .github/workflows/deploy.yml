name: CI/CD Pipeline & Cloudflare Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend & ATSForge Pytest Suite
        env:
          PYTHONPATH: apps/backend
        run: |
          python -m pytest tests -v

      - name: Validate Shared JSON Data Integrity
        run: |
          python -c "
          import json
          with open('packages/shared/profile_data.json') as f:
              p = json.load(f)
              assert p['personal']['name'] == 'Albert Linson'
          with open('packages/shared/freestack_data.json') as f:
              fs = json.load(f)
              assert fs['total_services'] > 500
          print('JSON Schemas Verified!')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm install --legacy-peer-deps

      - name: Run TypeScript Verification
        working-directory: apps/web
        run: npx tsc --noEmit

  deploy-cloudflare:
    name: Cloudflare Workers Deployment
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm install --legacy-peer-deps

      - name: Provision or Verify Cloudflare D1 Database & R2 Bucket
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node ../../scripts/prepare-cloudflare.mjs

      - name: Build Next.js Application with OpenNext
        working-directory: apps/web
        env:
          NEXT_PUBLIC_APP_NAME: "Albert Linson Personal Intelligence Platform"
          NEXT_PUBLIC_SITE_URL: "https://albertlinson.com"
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx opennextjs-cloudflare build --dangerouslyUseUnsupportedNextVersion

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
