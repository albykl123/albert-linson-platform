name: CI/CD Pipeline & Cloudflare Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy alembic pydantic pydantic-settings reportlab python-docx pypdf pytest httpx

      - name: Run Backend & ATSForge Pytest Suite
        env:
          PYTHONPATH: apps/backend
        run: |
          python -m pytest tests -v

      - name: Validate Shared JSON Data Integrity
        run: |
          python -c "
          import json
          with open('packages/shared/profile_data.json') as f:
              p = json.load(f)
              assert p['personal']['name'] == 'Albert Linson'
          with open('packages/shared/freestack_data.json') as f:
              fs = json.load(f)
              assert fs['total_services'] > 500
          print('JSON Schemas Verified!')
          "

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Run TypeScript Verification
        working-directory: apps/web
        run: npx tsc --noEmit

  deploy-cloudflare:
    name: Cloudflare Workers Deployment
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Provision or Verify Cloudflare D1 Database & R2 Bucket
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Checking and preparing Cloudflare D1 database..."
          D1_CREATE_OUT=$(npx wrangler d1 create albert-linson-db 2>&1 || true)
          echo "$D1_CREATE_OUT"
          NEW_ID=$(echo "$D1_CREATE_OUT" | grep -oE "database_id = \"[a-f0-9-]+\"" | cut -d'"' -f2 || true)
          if [ -n "$NEW_ID" ]; then
            echo "Captured new D1 UUID: $NEW_ID"
            sed -i "s/database_id = \".*\"/database_id = \"$NEW_ID\"/" wrangler.toml
          else
            LIST_ID=$(npx wrangler d1 list --json 2>/dev/null | grep -oE '"uuid":"[a-f0-9-]+"' | head -n 1 | cut -d'"' -f4 || true)
            if [ -n "$LIST_ID" ]; then
              echo "Matched existing D1 UUID: $LIST_ID"
              sed -i "s/database_id = \".*\"/database_id = \"$LIST_ID\"/" wrangler.toml
            fi
          fi
          echo "Checking Cloudflare R2 bucket..."
          npx wrangler r2 bucket create albert-linson-resumes 2>&1 || true

      - name: Build Next.js Application with OpenNext
        working-directory: apps/web
        env:
          NEXT_PUBLIC_APP_NAME: "Albert Linson Personal Intelligence Platform"
          NEXT_PUBLIC_SITE_URL: "https://albertlinson.com"
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: npx @opennextjs/cloudflare

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
