name: CI/CD Pipeline & Cloudflare Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Test & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy alembic pydantic pydantic-settings reportlab python-docx pypdf pytest httpx

      - name: Run Backend & ATSForge Pytest Suite
        env:
          PYTHONPATH: apps/backend
        run: |
          python -m pytest tests -v

      - name: Validate Shared JSON Data Integrity
        run: |
          python -c "
          import json
          with open('packages/shared/profile_data.json') as f:
              p = json.load(f)
              assert p['personal']['name'] == 'Albert Linson'
          with open('packages/shared/freestack_data.json') as f:
              fs = json.load(f)
              assert fs['total_services'] > 500
          print('JSON Schemas Verified!')
          "

  deploy-cloudflare:
    name: Cloudflare Pages Deployment
    needs: test-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install Frontend Dependencies
        working-directory: apps/web
        run: npm ci || npm install

      - name: Build Next.js Application
        working-directory: apps/web
        env:
          NEXT_PUBLIC_APP_NAME: "Albert Linson Personal Intelligence Platform"
          NEXT_PUBLIC_SITE_URL: "https://albertlinson.com"
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/.next --project-name=albert-linson-platform
